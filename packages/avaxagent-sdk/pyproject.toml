[project]
name = "avaxagent"
dynamic = ["version"]
description = "Modular Python SDK for on-chain AI agents on Avalanche C-Chain (fork of bnbagent)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
keywords = [
    "erc-8004",
    "x402",
    "blockchain",
    "ethereum",
    "agent",
    "web3",
    "avalanche",
    "avax",
    "c-chain",
    "sdk",
    "modular",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet",
]
dependencies = [
    "web3>=6.15.0,<8",
    "eth-account>=0.10.0,<0.14",
    "python-dotenv>=1.0.0,<2",
    "requests>=2.31.0,<3",
]

[project.urls]
Homepage = "https://github.com/bnb-chain/bnbagent-sdk/tree/main/python-avalanche"
Documentation = "https://github.com/bnb-chain/bnbagent-sdk/tree/main/python-avalanche#readme"
Repository = "https://github.com/bnb-chain/bnbagent-sdk"
Issues = "https://github.com/bnb-chain/bnbagent-sdk/issues"

[project.optional-dependencies]
ipfs = [
    "httpx>=0.25.0,<1",
]
turnkey = [
    "cryptography>=42.0.0,<51",
]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.25.0",
    "ruff>=0.4.0",
    # Exercises the turnkey extra's stamper in CI.
    "cryptography>=42.0.0",
]
examples = [
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "avaxagent/_version.py"

[tool.hatch.build.targets.sdist]
exclude = [
    ".claude/",
    ".github/",
    ".venv/",
    "_docs/",
    "dist/",
]

[tool.hatch.build.targets.wheel]
packages = ["avaxagent"]

# Contract ABIs live at the project level (./abis) as the single source of truth
# for this fork. The custom build hook below copies them into the package
# (avaxagent/abis/) at build time so `pip install` ships them; `artifacts` forces
# their inclusion even though the copied dir is git-ignored. The runtime loader
# (avaxagent/core/abis.py) prefers ./abis in a source checkout and uses the
# in-package copy when installed.
[tool.hatch.build]
artifacts = ["avaxagent/abis/*.json"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["avaxagent"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
