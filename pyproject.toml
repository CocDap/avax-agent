# uv workspace root for avaxagent-studio (Python side).
# Members: the FastAPI backend and the Avalanche SDK it depends on.
[project]
name = "avaxagent-studio"
version = "0.1.0"
description = "Avaxagent Studio monorepo (workspace root, not a distributable package)"
requires-python = ">=3.10"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/backend", "packages/avaxagent-sdk"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
